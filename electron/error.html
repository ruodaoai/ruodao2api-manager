<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruodao2API · 启动失败</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --line: #e7e9ee;
    --text: #1d2330;
    --muted: #6b7484;
    --faint: #98a0ae;
    --primary: #f4511e;
    --primary-dark: #d63f10;
    --primary-soft: #fff0eb;
    --mono: "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
  }
  .card {
    width: min(640px, 100%);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 18px 50px rgba(29, 35, 48, .08);
    padding: 34px 36px 30px;
  }
  .mark {
    width: 46px;
    height: 46px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 18px;
  }
  h1 { margin: 0 0 8px; font-size: 21px; }
  p { margin: 0; color: var(--muted); line-height: 1.7; font-size: 13.5px; }
  .detail {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    background: #fafbfc;
    border: 1px solid var(--line);
    color: #a3371a;
    font-family: var(--mono);
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .log {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--primary-soft);
    color: #8a3a1d;
    font-family: var(--mono);
    font-size: 11.5px;
    word-break: break-all;
  }
  .actions { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
  button {
    appearance: none;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--text);
    height: 36px;
    padding: 0 18px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { border-color: #cfd5df; }
  button.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }
  button.primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
  .hint { margin-top: 18px; font-size: 12px; color: var(--faint); line-height: 1.7; }
</style>
</head>
<body>
  <main class="card">
    <div class="mark">R</div>
    <h1 id="title">启动失败</h1>
    <p id="message">后台服务没有就绪。</p>
    <div class="detail" id="detail"></div>
    <div class="log" id="log"></div>
    <div class="actions">
      <button class="primary" id="retry" type="button">重试启动</button>
      <button id="open-log" type="button">打开后台日志</button>
      <button id="open-data" type="button">打开数据目录</button>
    </div>
    <div class="hint">
      常见原因：端口被其他程序占用、Python 未安装或数据目录不可写。
      开发模式请确认已安装 Python 3.9+，打包版请确认资源中的后端文件存在。
    </div>
  </main>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var title = params.get('message') || '启动失败';
    var detail = params.get('detail') || '';
    var logPath = params.get('log') || '';
    document.getElementById('title').textContent = title;
    document.getElementById('message').textContent =
      '桌面壳已打开，但本地网关没有成功响应。可以先查看日志定位原因，再重试启动。';
    if (detail) { document.getElementById('detail').textContent = detail; }
    else { document.getElementById('detail').style.display = 'none'; }
    if (logPath) { document.getElementById('log').textContent = '日志：' + logPath; }
    else { document.getElementById('log').style.display = 'none'; }
    var bridge = window.ruodaoDesktop || {};
    document.getElementById('retry').addEventListener('click', function () {
      if (bridge.retry) { bridge.retry(); }
    });
    document.getElementById('open-log').addEventListener('click', function () {
      if (bridge.openLog) { bridge.openLog(); }
    });
    document.getElementById('open-data').addEventListener('click', function () {
      if (bridge.openData) { bridge.openData(); }
    });
  })();
</script>
</body>
</html>
